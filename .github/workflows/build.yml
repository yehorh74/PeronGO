name: Build PeronGO (Signed APK & AAB & Web)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 1. Przygotowanie pliku Keystore z sekretu GitHuba
      - name: Prepare Keystore File
        run: |
          mkdir -p android/app
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore

      # 2. Wygenerowanie pliku key.properties bezpośrednio dla szablonu Fluttera
      - name: Create key.properties for Flutter
        run: |
          cat <<EOF > android/key.properties
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=app/release.keystore
          EOF

      # 3. Tworzenie pliku .env dla aplikacji
      - name: Create .env file
        run: |
          echo "X_API_KEY=${{ secrets.X_API_KEY }}" > .env

      # 4. Budowanie podpisanego APK
      - name: Build Signed APK
        run: |
          flet build apk --python-version 3.12 --arch arm64-v8a \
            --build-version "0.0.7" \
            --build-number ${{ github.run_number }} \
            -o dist/apk

      # 5. Budowanie podpisanego AAB
      - name: Build Signed AAB
        run: |
          flet build aab --python-version 3.12 --arch arm64-v8a \
            --build-version "0.0.7" \
            --build-number ${{ github.run_number }} \
            -o dist/aab

      # 6. Budowanie Web
      - name: Build Web
        run: flet build web --build-number ${{ github.run_number }} -o dist/web

      # 7. Wrzucenie gotowych buildów
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: perongo-release-builds
          path: dist/