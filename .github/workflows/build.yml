name: Build PeronGO (Signed APK & AAB & Web)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 1. Bezpieczne odkodowanie pliku .keystore (z flagą -d)
      - name: Decode Keystore
        run: |
          mkdir -p android/app
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore

      # 2. Tworzenie pliku .env z cudzysłowami (zabezpieczenie znaków specjalnych)
      - name: Create .env file
        run: |
          echo 'X_API_KEY="${{ secrets.X_API_KEY }}"' > .env

      # 3. Budowanie podpisanego APK z przekazaniem parametrów bezpośrednio w komendzie
      - name: Build Signed APK
        run: |
          flet build apk --python-version 3.12 --arch arm64-v8a -o dist/apk \
            --keystore-path android/app/release.keystore \
            --keystore-password "${{ secrets.KEYSTORE_PASSWORD }}" \
            --key-alias "${{ secrets.KEY_ALIAS }}" \
            --key-password "${{ secrets.KEY_PASSWORD }}"

      # 4. Budowanie podpisanego AAB (do Google Play)
      - name: Build Signed AAB
        run: |
          flet build aab --python-version 3.12 --arch arm64-v8a -o dist/aab \
            --keystore-path android/app/release.keystore \
            --keystore-password "${{ secrets.KEYSTORE_PASSWORD }}" \
            --key-alias "${{ secrets.KEY_ALIAS }}" \
            --key-password "${{ secrets.KEY_PASSWORD }}"

      # 5. Budowanie Web
      - name: Build Web
        run: flet build web -o dist/web

      # 6. Wrzuć zbudowane pliki jako Artifacts
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: perongo-release-builds
          path: dist/