name: Build PeronGO (Signed APK & AAB)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet==0.86.5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'

      - name: Prepare Keystore File
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > release.keystore

      - name: Build Raw AAB
        env:
          CI: "true"
          FLET_NON_INTERACTIVE: "true"
        run: |
          flet build aab --python-version 3.12 --arch arm64-v8a \
            --build-number ${{ github.run_number }} \
            -o dist/aab

      - name: Sign AAB with jarsigner
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          AAB_FILE=$(find dist/aab -name "*.aab" | head -n 1)
          
          echo "Podpisywanie pliku: $AAB_FILE"
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore release.keystore \
            -storepass:env KS_PASS \
            -keypass:env KEY_PASS \
            "$AAB_FILE" "$KEY_ALIAS"

      - name: Upload Mobile Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: perongo-mobile-builds
          path: |
            dist/aab