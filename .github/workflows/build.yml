name: Build PeronGO (Signed APK & AAB & Web)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create .env file
        run: |
          touch .env

      - name: Prepare Keystore File
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > release.keystore

      - name: Build Raw APK
        run: |
          flet build apk --python-version 3.12 --arch arm64-v8a \
            --build-number ${{ github.run_number }} \
            -o dist/apk

      - name: Sign APK with Android SDK apksigner
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          APKSIGNER=$(find $ANDROID_SDK_ROOT/build-tools -name apksigner | tail -n 1)
          APK_FILE=$(find dist/apk -name "*.apk" | head -n 1)
          
          echo "Podpisywanie pliku: $APK_FILE"
          $APKSIGNER sign --ks release.keystore \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KS_PASS \
            --key-pass env:KEY_PASS \
            "$APK_FILE"

      - name: Build Raw AAB
        run: |
          flet build aab --python-version 3.12 --arch arm64-v8a \
            --build-number ${{ github.run_number }} \
            -o dist/aab

      - name: Sign AAB with jarsigner
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          AAB_FILE=$(find dist/aab -name "*.aab" | head -n 1)
          
          echo "Podpisywanie pliku: $AAB_FILE"
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore release.keystore \
            -storepass:env KS_PASS \
            -keypass:env KEY_PASS \
            "$AAB_FILE" "$KEY_ALIAS"

      - name: Verify APK Signature
        run: |
          APKSIGNER=$(find $ANDROID_SDK_ROOT/build-tools -name apksigner | tail -n 1)
          APK_FILE=$(find dist/apk -name "*.apk" | head -n 1)
          $APKSIGNER verify --print-certs "$APK_FILE"

      - name: Build Web
        env:
          CI: "true"
          FLET_NON_INTERACTIVE: "true"
        run: flet build web --build-number ${{ github.run_number }} -o dist/web

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: perongo-release-builds
          path: dist/