name: Build PeronGO (Signed APK & AAB & Web)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 1. Odkodowanie pliku Keystore
      - name: Prepare Keystore File
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore

      # 2. Tworzenie pliku .env
      - name: Create .env file
        run: |
          echo "X_API_KEY=${{ secrets.X_API_KEY }}" > .env

      # 3. Budowanie surowego APK przez Flet
      - name: Build Raw APK
        run: |
          flet build apk --python-version 3.12 --arch arm64-v8a \
            --build-version "0.0.7" \
            --build-number ${{ github.run_number }} \
            -o dist/apk

      # 4. Wymuszone podpisanie APK za pomocą apksigner z Android SDK
      - name: Sign APK with Android SDK apksigner
        run: |
          APKSIGNER=$(find $ANDROID_SDK_ROOT/build-tools -name apksigner | tail -n 1)
          APK_FILE=$(find dist/apk -name "*.apk" | head -n 1)
          
          echo "Podpisywanie pliku: $APK_FILE"
          $APKSIGNER sign --ks release.keystore \
            --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
            --ks-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" \
            --key-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" \
            "$APK_FILE"

      # 5. Budowanie surowego AAB przez Flet
      - name: Build Raw AAB
        run: |
          flet build aab --python-version 3.12 --arch arm64-v8a \
            --build-version "0.0.7" \
            --build-number ${{ github.run_number }} \
            -o dist/aab

      # 6. Podpisywanie AAB za pomocą jarsigner
      - name: Sign AAB with jarsigner
        run: |
          AAB_FILE=$(find dist/aab -name "*.aab" | head -n 1)
          
          echo "Podpisywanie pliku: $AAB_FILE"
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore release.keystore \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -keypass "${{ secrets.KEYSTORE_PASSWORD }}" \
            "$AAB_FILE" "${{ secrets.KEY_ALIAS }}"

      # 7. Weryfikacja podpisu w logach
      - name: Verify APK Signature
        run: |
          APKSIGNER=$(find $ANDROID_SDK_ROOT/build-tools -name apksigner | tail -n 1)
          APK_FILE=$(find dist/apk -name "*.apk" | head -n 1)
          $APKSIGNER verify --print-certs "$APK_FILE"

      # 8. Budowanie Web
      - name: Build Web
        run: flet build web --build-number ${{ github.run_number }} -o dist/web

      # 9. Publikacja gotowych paczek
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: perongo-release-builds
          path: dist/