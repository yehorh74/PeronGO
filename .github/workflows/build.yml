name: Build PeronGO (Signed APK & AAB & Web)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 1. Odkodowanie pliku .keystore z Secretów GitHuba
      - name: Decode Keystore
        run: |
          mkdir -p android/app
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore

      # 2. Tworzenie pliku .env (z cudzysłowami chroniącymi znaki specjalne)
      - name: Create .env file
        run: |
          echo "X_API_KEY=${{ secrets.X_API_KEY }}" > .env

      # 3. Budowanie podpisanego APK przez zmienne środowiskowe Flet
      - name: Build Signed APK
        env:
          FLET_ANDROID_KEYSTORE_PATH: android/app/release.keystore
          FLET_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          FLET_ANDROID_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          FLET_ANDROID_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          flet build apk --python-version 3.12 --arch arm64-v8a \
            --build-version "0.0.7" \
            --build-number ${{ github.run_number }} \
            -o dist/apk

      # 4. Budowanie podpisanego AAB
      - name: Build Signed AAB
        env:
          FLET_ANDROID_KEYSTORE_PATH: android/app/release.keystore
          FLET_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          FLET_ANDROID_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          FLET_ANDROID_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          flet build aab --python-version 3.12 --arch arm64-v8a \
            --build-version "0.0.7" \
            --build-number ${{ github.run_number }} \
            -o dist/aab

      # 5. Budowanie Web
      - name: Build Web
        run: flet build web --build-number ${{ github.run_number }} -o dist/web

      # 6. Wrzuć zbudowane pliki jako Artifacts
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: perongo-release-builds
          path: dist/