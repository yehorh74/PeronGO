<!DOCTYPE html>
<html>
<head>
  <base href="%FLET_WEB_BASE_HREF%">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>PeronGO</title>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('flutter_service_worker.js');
      });
    }
    var flet_web_pyodide = true;
  </script>

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #121212; 
      color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    .splash-container {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 5px solid rgba(255, 255, 255, 0.1);
      border-top: 5px solid #2196F3;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .app-title {
      font-size: 1.5rem;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .subtitle {
      color: #888888;
      font-size: 0.9rem;
      margin: 0;
    }
  </style>

  %FLET_WEB_ENTRYPOINT%
</head>
<body>
  <div class="splash-container">
    <div class="spinner"></div>
    <div class="app-title">PeronGO</div>
    <p class="subtitle">Uruchamianie rozkładu jazdy...</p>
  </div>
</body>
</html>
