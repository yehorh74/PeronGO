[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "perongo"
version = "0.0.1"
description = "PKP timetable and delays mobile app"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Yehor Horin", email = "danedred15@gmail.com" }]

dependencies = [
    "flet[all]==0.80.3",
    "requests",
    "python-dotenv",
]

[dependency-groups]
dev = [
    "flet[all]==0.80.3",
]

[tool.uv]
prerelease = "allow"

[tool.flet]
org = "org.daned.perongo"
product = "PeronGO"
company = "Yehor Horin"

[tool.flet.app]
path = "."

[tool.flet.flutter.pubspec.dependency_overrides]
flet = { git = { url = "https://github.com/flet-dev/flet.git", ref = "main", path = "packages/flet" } }