[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "perongo"
version = "0.2.3"
description = "PKP timetable and delays mobile app"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Yehor Horin", email = "danedred15@gmail.com" }]

dependencies = [
    "flet",
    "requests",
    "python-dotenv",
    "beautifulsoup4",
]

[tool.uv]
prerelease = "allow"

[tool.flet]
org = "org.daned"
product = "PeronGO"
company = "Yehor Horin"

[tool.flet.app]
path = "."
assets = ["files"]

[tool.flet.icons]
android = "assets/icon.png"

[tool.flet.flutter.pubspec.dependency_overrides]
flet = { git = { url = "https://github.com/flet-dev/flet.git", ref = "main", path = "packages/flet" } }